<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>다시 쓰는 전시 · 안내 카드 스튜디오</title>
<style>
:root{--ink:#352940;--text:#49384e;--sub:#68586e;--line:#e6dbe9;--cream:#fbf8f4;--lilac:#eee4f8;--plum:#592d67;--rose:#f9e3e9;--mint:#e4f2e8;--red:#87254b;--surface:#fffdfa}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 "Malgun Gothic",system-ui,sans-serif}
header{background:#f1e6f7;border-bottom:1px solid #e4d3ec}
.head, main{max-width:1300px;margin:auto;padding-inline:30px}
.head{min-height:170px;padding-block:33px;display:flex;gap:28px;align-items:center;justify-content:space-between}
h1,h2,h3,p{margin:0}h1{font-size:clamp(1.95rem,4vw,3.55rem);letter-spacing:-.07em;line-height:1.16;margin:.14em 0 .25em}
h2{font-size:1.28rem;letter-spacing:-.04em;margin-bottom:12px}h3{font-size:1.09rem}
header p{color:var(--sub)}
.brand{font-size:.84rem;font-weight:750;color:var(--plum)}
.tabs-note{display:flex;align-items:center;gap:8px;flex-shrink:0;font-size:.87rem;font-weight:700}
.tabs-note span{background:var(--surface);border:1px solid #ddcbe8;border-radius:26px;padding:6px 10px}
.tabs-note b{color:#805b89;font-size:.8rem}
main{padding-block:24px 50px}
.layout{display:grid;grid-template-columns:minmax(268px,0.80fr) minmax(520px,2fr);align-items:start;gap:22px}
.panel{min-width:0;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:0 8px 30px #5130520a;padding:19px}
h2 span{font-size:.78rem;color:var(--sub);font-weight:500}
label{display:block;font-size:.86rem;font-weight:750}
input,select,textarea{width:100%;display:block;margin-top:4px;border:1px solid #d9cddc;border-radius:9px;padding:8px 9px;background:#fff;font:inherit;color:var(--ink);min-width:0}
textarea{min-height:86px;resize:vertical}
form{display:grid;gap:11px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
small,.help{color:var(--sub);font-size:.81rem}
button,a.button{display:inline-flex;align-items:center;justify-content:center;background:var(--plum);color:#fff;border:1px solid var(--plum);border-radius:9px;padding:8px 12px;font:inherit;font-weight:740;cursor:pointer;text-decoration:none;line-height:1.28}
button:disabled{opacity:.43;cursor:not-allowed}.ghost,a.ghost{background:white;color:var(--plum);border-color:#dac8df}
:focus-visible{outline:3px solid #a461b9;outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a,.actions button{font-size:.86rem}
.status{min-height:1.4em}.error{color:var(--red);font-weight:740}
.compare-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:10px}
.compare-head h2{margin:0}.compare-head label{width:205px;font-size:.8rem}
.compare-head select{font-weight:600}
.badge{border-radius:25px;background:var(--lilac);color:#593966;display:inline-block;font-size:.77rem;padding:4px 9px;font-weight:740}
.run-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:11px 0 14px;font-size:.83rem;color:var(--sub)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{border:1px solid #dfd0e3;border-radius:16px;background:white;min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card header{border:0;padding:14px 15px 13px;background:#f4e9f8}
.card:nth-child(2) header{background:#faeaeb}.card h3{margin-top:6px;line-height:1.3}.card .body{padding:15px;display:grid;gap:11px;align-content:start;flex:1}
.state,.chip{display:inline-block;font-size:.76rem;font-weight:750;padding:4px 7px;border-radius:7px;background:var(--mint);color:#325644}
.state.fail,.chip.fail{background:var(--rose);color:var(--red)}
.story{font-size:1rem;line-height:1.65;min-height:4.6em;white-space:pre-wrap;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.chip{overflow-wrap:anywhere}
.card footer{padding:0 15px 13px}.card summary{font-size:.84rem;color:var(--plum);cursor:pointer}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 system-ui,sans-serif;background:#f8f2f8;color:#49294f;border-radius:8px;padding:9px}
.blank{padding:31px 20px;background:#faf4fa;border:1px dashed #d8c6de;border-radius:13px;text-align:center;color:var(--sub)}
.metrics{overflow-x:auto;margin:16px 0 8px}
table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:540px}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid #eee5ee;white-space:nowrap}thead{background:#faf3fb}th{color:#4f3559}
#choice{margin-top:10px}#source-note{margin-top:8px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:900px){.head,main{padding-inline:18px}.layout{grid-template-columns:1fr}.tabs-note{display:none}}
@media(max-width:545px){.cards{grid-template-columns:1fr}.compare-head{flex-wrap:wrap;gap:6px}.compare-head label{width:100%}}
</style></head>
<body><header><div class="head"><div><p class="brand">캠퍼스 리폼 전시</p><h1>다시 쓰는 전시</h1><p>운영 메모로 관람객용 안내 카드를 만들고 두 모델의 결과를 비교합니다.</p></div>
<div class="tabs-note" aria-hidden="true"><span>운영 메모</span><b>→</b><span>카드 비교</span><b>→</b><span>채택</span></div></div></header>
<main>
<div class="layout">
<section class="panel" aria-labelledby="memo-title">
<h2 id="memo-title">운영 메모</h2>
<form id="memo">
<label>작품 예시<select id="case-list"></select></label>
<label>작품명<input id="title" maxlength="80" required></label>
<label>재료와 리폼 과정<textarea id="material" maxlength="650" required></textarea></label>
<div class="pair"><label>종류<input id="kind" maxlength="30" required></label><label>장소<input id="location" maxlength="60" required></label></div>
<div class="pair"><label>관람료<input id="fee" maxlength="45"></label><label>예약<input id="booking" maxlength="60" placeholder="비어 있으면 확인 필요"></label></div>
<label>소개할 관람객<select id="audience"><option value="공통">공통</option><option>처음 방문한 학생</option><option>리폼에 관심 있는 학생</option></select></label>
<div class="actions"><button type="submit">이 메모의 결과 보기</button><button class="ghost" id="memo-download" type="button">내 메모 저장</button></div>
<div class="actions"><a class="button ghost" id="colab" target="_blank" rel="noopener">Colab에서 새 카드 만들기</a></div>
<p class="status help" id="memo-status" role="status"></p>
</form>
</section>
<section class="panel" aria-labelledby="compare-title">
<div class="compare-head"><h2 id="compare-title">관람객용 안내 카드</h2><label>비교 실험<select id="experiment"></select></label></div>
<div class="run-head"><span class="badge" id="origin"></span><span id="source-label"></span></div>
<div class="cards" id="cards"></div>
<div class="metrics" id="metrics"></div>
<p class="help" id="source-note"></p>
<div class="actions"><button id="import-button" type="button" class="ghost">Colab 결과 불러오기</button><button id="card-download" class="ghost" type="button" disabled>텍스트 저장</button></div>
<input id="file-input" type="file" accept=".json,application/json" class="sr-only" aria-label="Colab 결과 파일">
<p class="status" id="choice" role="status">비교 후 관람객에게 보여 줄 카드를 고르세요.</p>
</section>
</div></main>
<script id="payload" type="application/json">__SHOWCASE_JSON__</script><script>
'use strict';
const app = JSON.parse(document.getElementById('payload').textContent);
const el = id => document.getElementById(id);
const nameFields = {종류:'kind',장소:'location',관람료:'fee',예약:'booking'};
const experiment = el('experiment'), cards = el('cards'), metrics = el('metrics');
const memo = el('memo'), preset = el('case-list');
let items = app.items, current = '', selected = null, editing = false;
function node(tag, text, css) {
 const element = document.createElement(tag);
 if(text !== undefined) element.textContent = String(text);
 if(css) element.className = css;
 return element;
}
function option(select, label, value) {
 const o = node('option',label);
 o.value = value;
 select.append(o);
}
function fill(c) {
 el('title').value=c.title;
 el('material').value=c.material;
 for(const [f,id] of Object.entries(nameFields)) el(id).value=c.facts[f] === '확인 필요' ? '' : c.facts[f];
 el('audience').value=c.audience || '공통';
 editing=false;
 el('memo-status').textContent='';
}
function readMemo() {
 return {schema:'w13b-memo-v2',title:el('title').value.trim(),material:el('material').value.trim(),
   audience:el('audience').value,facts:Object.fromEntries(Object.entries(nameFields)
     .map(([f,id])=>[f,el(id).value.trim() || '확인 필요']))};
}
function sameMemo(form, target) {
 return form.title===target.title && form.material===target.material && form.audience===(target.audience||'공통') &&
   Object.keys(nameFields).every(f=>form.facts[f]===target.facts[f]);
}
function save(obj,name, mime='application/json') {
 const blob = new Blob([mime==='application/json'?JSON.stringify(obj,null,2):obj],{type:mime+';charset=utf-8'});
 const link = node('a');link.href=URL.createObjectURL(blob);link.download=name;link.click();
 setTimeout(()=>URL.revokeObjectURL(link.href),500);
}
function clearCards(text) {
 cards.replaceChildren(node('div',text,'blank'));
 metrics.replaceChildren();
 el('origin').textContent='메모 편집';
 el('source-label').textContent='';
 el('source-note').textContent='';
 choose(null);
}
function choose(record) {
 selected=record;
 el('card-download').disabled=!record;
 el('choice').textContent=record ? record.name+' 카드를 채택했습니다. '+record.run_id :
   '비교 후 관람객에게 보여 줄 카드를 고르세요.';
}
function renderCard(row,c) {
 const card=node('article',undefined,'card'), top=node('header'), body=node('div',undefined,'body');
 top.append(node('span',row.name,'badge'),node('h3',c.title));
 const approval=row.approved?'검증 통과 · 문장 검토':'게시 보류';
 const label=node('p',approval,'state'+(row.approved?'':' fail'));
 body.append(node('p',row.narrative||'생성된 소개 문장이 없습니다.','story'),label);
 const facts=node('div',undefined,'facts');
 for(const f of row.fields) {
   const value=f.claim || '누락';
   const chip=node('span',f.field+' · '+value,'chip'+(f.status==='일치'?'':' fail'));
   chip.title='운영 메모 '+f.reference;
   facts.append(chip);
 }
 body.append(facts);
 for(const issue of row.issues) body.append(node('small',issue,'error'));
 const btn=node('button','이 카드 채택');
 btn.type='button';btn.disabled=!row.approved;btn.addEventListener('click',()=>choose(row));
 body.append(btn);
 const foot=node('footer'), details=node('details');
 details.append(node('summary','모델 원문과 근거'),node('pre',row.raw||'(출력 없음)'));
 for(const f of row.fields) details.append(node('p',f.field+' · '+(f.claim||'누락')+' ↔ '+f.reference+' · '+f.status,'help'));
 details.append(node('p','실행 '+row.run_id,'help'));
 foot.append(details);
 card.append(top,body,foot);return card;
}
function render() {
 const x=items.find(item=>item.key===current && item.kind===experiment.value);
 if(editing || !x){clearCards('이 메모의 결과를 Colab에서 만든 뒤 불러오세요.');return}
 choose(null);
 el('origin').textContent=x.origin==='live'?'내 Colab 실측':'수업 실측 재생';
 el('source-label').textContent=x.caption;
 cards.replaceChildren(...x.rows.map(r=>renderCard(r,x.case)));
 const table=node('table'), head=table.createTHead().insertRow();
 for(const h of ['조건','업데이트','생성 설정','사실 일치','형식','최대 반복','정답 NLL']) head.append(node('th',h));
 const tb=table.createTBody();
 for(const r of x.rows){
   const tr=tb.insertRow();
   for(const v of [r.name,r.steps,r.temperature===null?'Greedy':'T '+r.temperature,r.matches+'/'+r.fields.length,
     r.strict?'통과':'실패',r.repetition,r.nll===null?'—':r.nll.toFixed(4)]) tr.append(node('td',v));
 }
 metrics.replaceChildren(table);
 el('source-note').textContent='정답 NLL · 정답 토큰에 대한 모델의 평균 손실';
}
function setCase(key) {
 current=key;
 const relevant=items.filter(x=>x.key===key);
 if(!relevant.length) return;
 fill(relevant[0].case);preset.value=key;
 experiment.replaceChildren();
 for(const x of relevant) option(experiment,x.title,x.kind);
 render();
}
function refreshList(key) {
 preset.replaceChildren();
 const seen=new Set();
 for(const x of items) if(!seen.has(x.key)){option(preset,x.case.title,x.key);seen.add(x.key)}
 setCase(key || items[0].key);
}
function validate(x){
 return x && typeof x.key==='string' && typeof x.kind==='string' && typeof x.title==='string' &&
  typeof x.caption==='string' && ['live','replay'].includes(x.origin) &&
  typeof x.case?.title==='string' && typeof x.case?.material==='string' &&
  Object.keys(nameFields).every(f=>typeof x.case?.facts?.[f]==='string') &&
  Array.isArray(x.rows) && x.rows.length===2 && x.rows.every(r=>
   typeof r.raw==='string'&&typeof r.name==='string'&&typeof r.run_id==='string'&&typeof r.approved==='boolean'&&
   (r.nll===null || (typeof r.nll==='number'&&Number.isFinite(r.nll))) &&
   Array.isArray(r.issues)&&Array.isArray(r.fields)&&r.fields.length===4);
}
el('colab').href=app.colab;
preset.addEventListener('change',()=>setCase(preset.value));
experiment.addEventListener('change',render);
memo.addEventListener('input',e=>{
 if(e.target===preset)return;
 const base=items.find(x=>x.key===current)?.case;
 editing=!base || !sameMemo(readMemo(),base);
 if(editing){clearCards('메모가 바뀌었습니다. Colab에서 이 메모로 생성한 결과를 불러오세요.');}
 else render();
});
memo.addEventListener('submit',e=>{
 e.preventDefault();render();
 el('memo-status').textContent=editing ?
 '내 메모를 저장한 뒤 Colab의 운영 메모 영역에서 불러오세요.' : '같은 운영 메모에서 나온 두 조건을 비교합니다.';
});
el('memo-download').addEventListener('click',()=>{
 if(!memo.reportValidity())return;
 save(readMemo(),'w13b-my-memo.json');
 el('memo-status').textContent='메모를 저장했습니다.';
});
el('import-button').addEventListener('click',()=>el('file-input').click());
el('file-input').addEventListener('change',async e=>{
 const [file]=e.target.files;
 if(!file)return;
 try{
  if(file.size>1000000)throw Error();
  const data=JSON.parse(await file.text());
  if(data.schema!=='w13b-cards-v2'||!Array.isArray(data.items)||!data.items.length||data.items.length>12||
    !data.items.every(validate))throw Error();
  const saved=readMemo();
  if(editing && !data.items.some(x=>sameMemo(saved,x.case))) {
   el('choice').textContent='편집한 메모와 다른 결과입니다. 이 메모로 실행한 JSON을 가져오세요.';return;
  }
  const first=editing ? data.items.find(x=>sameMemo(saved,x.case)) : data.items[0];
  const keep=items.filter(item=>!data.items.some(x=>x.key===item.key&&x.kind===item.kind));
  items=[...data.items,...keep];
  refreshList(first.key);
  experiment.value=first.kind;render();
  el('choice').textContent='Colab 결과를 불러왔습니다.';
 }catch{el('choice').textContent='W13B Colab의 비교 결과 JSON을 선택하세요.';}
 finally{e.target.value='';}
});
el('card-download').addEventListener('click',()=>{
 if(!selected)return;
 const c=items.find(x=>x.key===current).case;
 const facts=selected.fields.map(x=>x.field+' '+x.claim).join(' · ');
 save(c.title+'\n\n'+selected.narrative+'\n\n'+facts+'\n','w13b-visitor-card.txt','text/plain');
});
refreshList(app.initial);
</script></body></html>
