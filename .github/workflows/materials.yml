name: Validate student materials
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing branch, tag, or commit to validate
        required: false
        default: ''
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pypdf PyYAML
      - run: python scripts/validate_notion_bundle.py course/notion --strict
      - run: python scripts/check_public_release.py .
      - name: Install declared Python lab environment
        if: hashFiles('requirements-lab.txt') != ''
        run: pip install -r requirements.txt -r requirements-lab.txt
      - name: Execute registered Python notebooks
        if: hashFiles('requirements-lab.txt') != ''
        run: |
          python - <<'PY'
          import ast, json, os, subprocess, sys, tomllib, yaml
          from pathlib import Path
          config = yaml.safe_load(Path('course/course.yml').read_text())
          project_file = Path('src/pyproject.toml')
          project = tomllib.loads(project_file.read_text(encoding='utf-8')) if project_file.exists() else {}
          package_name = project.get('project', {}).get('name')
          repository = os.environ.get('GITHUB_REPOSITORY', '')
          for session in config['sessions']:
              for lab in session.get('labs', []):
                  if lab.endswith('.ipynb'):
                      # Legacy Colab-only bootstraps also need their declared pin in CI.
                      notebook = json.loads(Path(lab).read_text(encoding='utf-8'))
                      refs = []
                      for cell in notebook['cells']:
                          if cell['cell_type'] != 'code':
                              continue
                          source = ''.join(cell['source'])
                          try:
                              tree = ast.parse(source)
                          except SyntaxError:  # IPython syntax in unrelated legacy cells.
                              continue
                          for node in tree.body:
                              if isinstance(node, ast.Assign) and any(
                                  isinstance(t, ast.Name) and t.id == 'COURSE_REF' for t in node.targets
                              ) and isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                                  refs.append(node.value.value)
                      if refs:
                          if len(set(refs)) != 1 or not all(c.isalnum() or c in '-_./' for c in refs[0]):
                              raise ValueError('Ambiguous or invalid notebook course ref: ' + lab)
                          if not package_name or not repository:
                              raise ValueError('Pinned notebook requires package and repository metadata')
                          package = package_name + ' @ git+https://github.com/' + repository + '.git@' + refs[0] + '#subdirectory=src'
                          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', package], check=True)
                      subprocess.run([sys.executable, 'scripts/execute_notebook.py', lab, '--require-checks'], check=True)
          PY
