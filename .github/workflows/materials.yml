name: Validate student materials
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pypdf PyYAML
      - run: python scripts/validate_notion_bundle.py course/notion --strict
      - run: python scripts/check_public_release.py .
