name: Validate student materials
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing branch, tag, or commit to validate
        required: false
        default: ''
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pypdf PyYAML
      - run: python scripts/validate_notion_bundle.py course/notion --strict
      - run: python scripts/check_public_release.py .
      - name: Install declared Python lab environment
        if: hashFiles('requirements-lab.txt') != ''
        run: pip install -r requirements.txt -r requirements-lab.txt
      - name: Execute registered Python notebooks
        if: hashFiles('requirements-lab.txt') != ''
        run: |
          python - <<'PY'
          import ast, json, os, re, subprocess, sys, tomllib, yaml
          from pathlib import Path
          def pinned_install_commands(notebook, package_name, repository, optional_extras):
              refs, extras, public = [], set(), False
              for cell in notebook['cells']:
                  if cell['cell_type'] != 'code':
                      continue
                  try:
                      tree = ast.parse(''.join(cell['source']))
                  except SyntaxError:
                      continue
                  for node in tree.body:
                      if isinstance(node, ast.Assign) and isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                          names = {t.id for t in node.targets if isinstance(t, ast.Name)}
                          if names.intersection({'COURSE_REF', 'PUBLIC_REF'}):
                              refs.append(node.value.value)
                              public |= 'PUBLIC_REF' in names
                  for node in ast.walk(tree):
                      if package_name and isinstance(node, ast.Constant) and isinstance(node.value, str):
                          match = re.fullmatch(re.escape(package_name) + r'\[([A-Za-z0-9_,.-]+)\]\s*@\s*', node.value)
                          if match:
                              extras.update(match[1].split(','))
              if not refs:
                  return []
              if len(set(refs)) != 1 or not refs[0] or not all(c.isalnum() or c in '-_./' for c in refs[0]):
                  raise ValueError('Ambiguous or invalid notebook course ref')
              if not package_name or not repository:
                  raise ValueError('Pinned notebook requires package and repository metadata')
              if public and extras.difference(optional_extras):
                  raise ValueError('Notebook requests undeclared project extras')
              selector = package_name + ('[' + ','.join(sorted(extras)) + ']' if public and extras else '')
              package = selector + ' @ git+https://github.com/' + repository + '.git@' + refs[0] + '#subdirectory=src'
              install = [sys.executable, '-m', 'pip', 'install']
              if not public:
                  return [install + ['--no-deps', package]]
              # Resolve declared dependencies, then replace only the project with
              # a regular wheel BEFORE starting the notebook's fresh kernel.
              # This also replaces a same-version editable left by an older lab
              # without force-reinstalling the entire ML dependency stack.
              return [install + [package], install + ['--force-reinstall', '--no-deps', package]]

          config = yaml.safe_load(Path('course/course.yml').read_text())
          project_file = Path('src/pyproject.toml')
          project = tomllib.loads(project_file.read_text(encoding='utf-8')) if project_file.exists() else {}
          package_name = project.get('project', {}).get('name')
          repository = os.environ.get('GITHUB_REPOSITORY', '')
          for session in config['sessions']:
              for lab in session.get('labs', []):
                  if lab.endswith('.ipynb'):
                      notebook = json.loads(Path(lab).read_text(encoding='utf-8'))
                      for command in pinned_install_commands(notebook, package_name, repository,
                              project.get('project', {}).get('optional-dependencies', {})):
                          subprocess.run(command, check=True)
                      subprocess.run([sys.executable, 'scripts/execute_notebook.py', lab, '--require-checks'], check=True)
          PY
