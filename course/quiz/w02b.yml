source: course/notion/w02b/w02b-language-model-applications.md
provenance: W02B 강의노트의8개 점검 질문에 대응하는 수업용 자체 해설. 먼저 문제를 풀어 본 뒤 확인한다.
items:
- question: '`cat`과 ` cat`의 토큰 ID가 다를 수 있는 이유는 무엇인가?'
  answer: 공백도 입력의 일부이며 토크나이저가 앞 공백을 포함한 조각을 별도 토큰으로 사용할 수 있기 때문이다. ID는 해당 모델 어휘표의
    식별자이므로 다른 모델에 그대로 전용할 수 없다.
- question: 출력 형태가 `[배치, 위치, 어휘]`일 때 다음 토큰 분포를 읽는 위치는 어디인가?
  answer: 문장 하나라면 logits[0, -1, :]로 마지막 입력 위치의 전체 어휘 벡터를 읽는다. [0, 0, :]는 첫 위치이고, 마지막
    어휘 원소 하나를 선택하는 것도 다르다.
- question: 상위 후보 8개의 확률 합이 1보다 작은 것이 오류인가?
  answer: 오류가 아니다. 분모는 전체 어휘이며 화면은 상위8개만 보여 준다. 보이지 않는 후보도 확률을 가진다. 8개끼리 재정규화한 조건부
    표와 구분해야 한다.
- question: temperature만 비교하려면 top-k와 top-p를 어떻게 설정하는가?
  answer: 이 패키지에서는 top_k=0, top_p=1로 두 필터를 해제한다. 프롬프트·seed·최대 새 토큰 수를 유지하고 T만 바꾼다.
    greedy는 sample용 설정을 사용하지 않는다.
- question: 확률이 0.60, 0.25, 0.10, 0.05일 때 top-p=0.80은 몇 개를 남기는가?
  answer: 확률순 첫2개를 남긴다. 첫 후보만으로는0.60<0.80이고 두 번째까지0.85≥0.80이다. 임계값을 처음 넘기는 후보까지 포함한다.
    남긴 후보는0.60/0.85와0.25/0.85로 다시 정규화한다.
- question: 퓨샷 프롬프트에 예시 2개를 추가하면 모델 가중치가 업데이트되는가?
  answer: 아니다. 이번 퓨샷은 입력 프롬프트에 예시2개를 추가할 뿐, gradient update나 optimizer step을 수행하지
    않는다. 미세조정과 구분한다.
- question: 두 레이블 내 양성 비율이 0.9이면 90% 확률로 정답이라고 말할 수 있는가?
  answer: 그렇게 말할 수 없다. 다음 토큰을 두 레이블로 제한한 상대 비율이며 정답 여부에 대해 보정된 확신도가 아니다. 두 레이블이 전체
    어휘에서 차지하는 확률 질량과 별도 평가도 확인해야 한다.
- question: 웹 앱의 버튼 callback 안에서 모델을 매번 다시 로드하면 어떤 문제가 생기는가?
  answer: 불필요한 다운로드 확인·모델 로딩·메모리 할당이 반복되어 응답이 느려지고 자원을 낭비한다. 노트북/앱 시작 때 한 번 만든 lab을
    callback이 재사용한다. 화면 입력과 함수 반환값의 연결은 별도로 구성한다.
