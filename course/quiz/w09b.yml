source: course/notion/w09b/w09b-workbook.md
provenance: 실험 기록지의 복습 점검 8문항과 정확히 대응하는 공개 개념 해설. Colab A1–B6의 완성 코드와 교수자 상세 풀이와는 별도이다.
items:
- question: 문장 분류 labels와 causal LM labels의 크기와 의미는 어떻게 다른가?
  answer: '문장 분류는 배치의 각 문장에 하나의 클래스 정답을 두므로 $[B]$이다. causal LM은 각 입력 위치에 대응하는 토큰 정답을 만들므로 $[B,L]$이며, 모델의 손실 계산에서 앞 위치의 출력과 다음 위치의 정답을 맞춘다. padding 등 손실에서 제외할 위치는 -100이다. 같은 labels라는 이름만으로 같은 정답 구조라고 해석하지 않는다.'
- question: validation과 최종 test를 구별하는 이유는 무엇인가?
  answer: validation은 학습 상태와 설정을 점검하는 데 사용하고 test는 선택이 끝난 뒤 최종 평가에 사용한다. test 결과를 반복해서 보며 설정을 고르면 그 결과에 맞춘 선택이 일어나 독립적 평가가 약해진다. 같은 문서나 정규화한 중복 문서가 분할을 넘지 않게 하고, 의미가 비슷한 문서는 별도로 검토한다.
- question: 사전학습 모델의 새 분류 헤드 초기화 메시지는 무엇을 뜻하는가?
  answer: 사전학습 목적의 출력 층과 이번 네 클래스 분류용 층이 달라 일부 파라미터가 새로 초기화되었다는 뜻이다. 사전학습 인코더의 언어 표현을 이어받아도 새 분류용 층은 주제 라벨로 학습해야 한다. 기본 모델 로드 성공을 분류 학습 완료로 간주하지 않는다.
- question: padding과 truncation은 어떻게 다르며 attention mask는 무엇을 표시하는가?
  answer: padding은 길이가 다른 입력을 배치 안에서 맞추기 위해 빈 위치를 추가하는 작업이고 truncation은 길이 제한을 넘는 내용을 자르는 작업이다. 이번 attention mask는 실제 토큰 위치1과 padding0을 나타낸다. 마스크가 잘린 문장의 내용을 복구하지는 않으며, causal attention과 손실의 ignore 위치도 역할을 구분한다.
- question: 정확도가 높아도 소수 클래스의 오류를 놓칠 수 있는 이유는 무엇인가?
  answer: 다수 클래스를 주로 맞혀도 전체 문서의 정확도는 높을 수 있기 때문이다. 혼동행렬과 클래스별 recall을 확인하고, 클래스별 F1에 같은 비중을 주는 macro F1과 표본 수로 가중하는 weighted F1을 구별한다. 어떤 지표를 중시할지는 실제 사용 목적과 놓치는 오류의 영향을 함께 고려한다.
- question: EOS와 PAD의 ID가 같을 때 실제 EOS 정답을 보존하려면 무엇을 확인해야 하는가?
  answer: 토큰 ID만으로 전부 무시하지 말고 실제 입력 위치인지 padding 위치인지 attention mask로 구분한다. 이번 수집기는 마스크0인 위치만 labels에서 -100으로 바꾸고 실제 EOS는 정답으로 남긴다. labels를 복사한 뒤 모델 내부에서 한 번 정렬하므로 수집기에서 한 번 더 이동시키지 않는다.
- question: 프롬프트 변경과 실제 파인튜닝을 구별할 실행 증거는 무엇인가?
  answer: 프롬프트 변경은 고정 가중치에 주는 입력이 달라지는 추론이다. 파인튜닝은 정답으로 손실을 계산하고 backward와 optimizer 갱신으로 가중치를 바꾸는 실제 학습이다. 가중치 일부의 변화와 실행 로그를 확인할 수 있지만 그것만으로 품질 향상을 증명하지는 않는다. 품질은 고정한 평가 조건에서 별도로 검토한다.
- question: 지시 데이터 형식화, SFT 학습, 지시 이행 평가를 구별해야 하는 이유는 무엇인가?
  answer: 지시·입력·응답을 직렬화해도 아직 모델의 가중치는 바뀌지 않는다. SFT 학습은 그 예제로 실제 손실과 모수 갱신을 수행하는 단계이며, 지시를 잘 따르는지는 학습하지 않은 문서·지시에서 내용과 출력 형식 등을 평가해야 한다. 어댑터는 갱신 파라미터의 방식이므로 SFT와 조합할 수 있으며 같은 분류 기준의 반대말이 아니다.
