source: course/notion/w11b/w11b-workbook.md
provenance: 학생용 복습 점검의 별도 개념 해설. 독립 실습9A1–9B5·교재 장말 문제의 완전 풀이와 완성 코드는 비공개 교수자판에 분리합니다.
items:
- question: 샘플링 레이트를 바꾸는 것과 라벨만 바꾸는 것은 어떻게 다른가요?
  answer: 실제 resample은 새 시간축의 값을 계산해 원래 시간을 유지합니다. 같은 값에 rate 라벨만 바꾸면 재생 시간·속도·음높이가
    함께 변합니다. 업샘플링은 잃은 고주파를 복구하지 않습니다.
- question: hop을 두 배로 바꾸면 시간축과 주파수축은 어떻게 달라지나요?
  answer: n_fft를 고정하면 시간 칸이 대략 절반으로 줄고 주파수 bin 수·간격은 유지됩니다. padding과 끝 처리에 따라 정확한
    프레임 수는 다를 수 있습니다.
- question: CTC에서 blank를 먼저 제거하면 왜 반복 글자를 잃을 수 있나요?
  answer: l,l,blank,l에서 blank를 먼저 지우면 l들이 연속해 하나로 합쳐집니다. 연속 동일 ID를 먼저 병합하고 blank를
    제거해야 ll을 보존합니다. blank와 단어 구분자는 별도입니다.
- question: WER의 분모는 무엇이며100%를 넘을 수 있나요?
  answer: 기준 문장의 단어/어절 수입니다. 삽입이 많으면 (S+D+I)/N은1을 넘을 수 있습니다. 기준이 비면 별도 정책이 필요합니다.
- question: SpeechT5 decoder와 vocoder의 역할은 어떻게 다른가요?
  answer: SpeechT5 생성 decoder는 Mel 프레임을 예측하고 HiFiGAN vocoder는 Mel에서 파형을 만듭니다. 현재 stop
    threshold는 decoder 종료 기준이며 vocoder 인자가 아닙니다.
- question: CLAP 조건과 AudioLDM이 denoise하는 대상은 같은가요?
  answer: 다릅니다. CLAP 임베딩은 텍스트·오디오 조건이고, AudioLDM은 VAE가 압축한 Mel latent에서 연속 확산을 수행합니다.
    DiffSound의 이산 확산과도 구별합니다.
