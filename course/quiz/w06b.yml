source: course/notion/w06b/w06b-workbook.md
provenance: 실습 기록지12문항 중 핵심10문항 해설(3·7번은 본문에서 직접 설명). 노트북 활동의 완성 코드와 교수자 대본은 별도 비공개
  자료.
items:
- question: 학습과 생성에서 각각 무엇이 바뀌나요?
  answer: 학습은 손실과 gradient로 모델 가중치를 갱신한다. 생성은 가중치를 고정하고 새로운 잡음에서 이미지 또는 잠재 상태를 반복
    갱신한다.
- question: 클래스 조건부 잡음 예측에서 라벨과 정답 잡음은 역할이 어떻게 다른가요?
  answer: 라벨은 무엇을 생성할지 알려주는 예측기의 입력이다. 정답은 이미지에 추가했던 Gaussian 잡음 배열이다. 클래스 번호와 픽셀
    사이의 MSE를 최소화하는 문제가 아니다.
- question: SD 1.5에서 512×512×3과 64×64×4의 원소 수 비는 얼마이며, 실행시간에 무엇을 보장하나요?
  answer: 786432/16384=48이다. 공간 길이는 각각8분의1이고 채널은3에서4로 바뀐다. 원소 수의 감소이며 전체 네트워크 실행시간이
    정확히48배 개선된다는 보장은 없다.
- question: 텍스트로 새 이미지를 만들 때 원본 사진과 VAE 인코더가 꼭 필요한가요?
  answer: 필요하지 않다. text-to-image 생성은 새 잠재 잡음에서 시작하여 마지막에 VAE 디코더를 쓴다. 인코더는 학습 이미지
    표현이나 기존 이미지 복원 실험에 사용한다.
- question: 77과 768은 각각 무엇을 뜻하며 pooled CLIP 검색 벡터와 어떻게 다른가요?
  answer: 77은 시작·종료·패딩을 포함한 토큰 위치축,768은 SD1.5의 토큰별 hidden size이다. 검색의 pooled 문장 벡터와
    달리 각 토큰의 표현 시퀀스를 U-Net에 제공한다.
- question: SD 1.5 U-Net의 입력 상태와 출력은 shape와 의미가 어떻게 다른가요?
  answer: 512이미지 예에서 입력과 출력은 모두(B,4,64,64)이지만 입력은 현재 잠재 상태, 출력은 SD1.5의 예측 잡음이다. 스케줄러가
    그 예측을 해석해 다음 상태를 계산한다.
- question: CFG의 두 예측은 서로 다른 모델인가요? 어떤 입력을 같게 유지하나요?
  answer: 같은 가중치의 모델이다. 같은 잠재 상태와 시점에 빈 조건·텍스트 조건을 각각 넣는다. 배치로 묶을 수 있지만 두 개의 독립 학습
    모델을 뜻하지 않는다.
- question: 수학식의 scale 0과 Diffusers API의 guidance_scale 0을 동일하게 해석해도 되나요?
  answer: 동일하지 않다. 수학식 u+s(c-u)에서0은u이지만 Diffusers SD pipeline은guidance_scale<=1이면
    두 갈래CFG를 건너뛴다. 실제 비교는1·4·7.5·12로 한다.
- question: CFG 비교에서 seed까지 바꾸면 무엇을 해석하기 어려워지나요?
  answer: 차이에 조건 강조와 출발 잡음의 효과가 함께 들어가 CFG만의 영향을 분리하기 어렵다. 모델·프롬프트·seed·해상도·scheduler·steps를
    고정해야 한다.
- question: “기록 모드 검증 통과”와 “SD GPU 생성 성공”은 같은 증거인가요?
  answer: 다르다. 기록 분석은 저장된 실제 파일·수치를 읽고 계산한 증거이고 GPU생성은 지금 모델을 실행해 새로운 출력을 얻은 증거다.
    출력mode·장치·시간을 각각 기록한다.
