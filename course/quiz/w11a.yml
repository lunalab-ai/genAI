source: course/notion/w11a/w11a-workbook.md
provenance: 학생용 자기점검의 별도 개념 해설. 실습8A1-8B4 및 장말E1-E5의 완성 구현·상세 정답은 별도 비공개.
items:
- question: 7장 적응과 8장 생성 제어에서 이번 실행 중 바뀌는 것은?
  answer: 7장 학습은 학습 가능한 가중치를 갱신한다. 8장 편집은 준비된 가중치에서 입력 조건·시작 상태·attention 등을 조절한다.
    adapter 자체가 별도로 사전학습되었다는 사실과 현재 편집 중 학습 여부는 구별한다.
- question: strength는 noise scheduler의 alpha_bar와 같은 값인가?
  answer: 아니다. strength는 시작 timestep/실행 구간을 선택하는 인자이고 alpha_bar는 선택한 timestep에 대응하는
    scheduler 값이다.
- question: mask 바깥은 diffusion inpainting을 호출하면 픽셀까지 항상 같은가?
  answer: 아니다. VAE 재구성 등으로 변할 수 있다. 정확한 픽셀 보존을 원하면 명시적인 최종 overlay와 별도 측정이 필요하다.
- question: ControlNet과 IP-Adapter의 대표적인 개입 위치는?
  answer: ControlNet은 공간 조건에서 만든 residual을 중간 feature에 주입하고 IP-Adapter는 이미지 특징을 별도
    image attention 경로에 넣는다. 둘을 함께 쓸 때 개별 조건을 통제해 관찰한다.
- question: 원본과의 MSE가 큰 편집은 모두 실패인가?
  answer: 아니다. 의도한 변화도 차이를 만든다. 원본 복원 오차·목표 속성 변경·비편집 영역 보존을 구별해 평가한다.
- question: 앱에서 기록 선택 checkbox를 바꾸면 현재 SD를 새로 실행하는가?
  answer: 아니다. 기록 선택은 검증된 과거 실행 PNG와 설정을 읽는다. 현재 실행인 소형 모델 denoising과 화면·JSON의 mode를
    구별한다.
