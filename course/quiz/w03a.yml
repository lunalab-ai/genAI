source: course/notion/w03a/w03a-transformers.md
provenance: W03A 강의노트 Q1–Q10에 대응하는 수업용 자체 해설. 먼저 풀어 본 뒤 확인한다.
items:
- question: 토큰 ID와 임베딩 벡터는 어떻게 다른가?
  answer: ID는 어휘표의 식별 번호이고 임베딩은 그 번호로 조회하는 학습 가능한 실수 벡터다. ID 크기에 의미의 크기가 담긴 것은 아니다. 같은 시작 임베딩도 블록 이후 문맥 표현은 달라질 수 있다.
- question: QK 전치의 3행 2열은 무엇을 뜻하는가?
  answer: 세 번째 위치의 Query와 두 번째 위치의 Key를 내적한 점수다. 세 번째 위치가 두 번째 위치를 얼마나 참고할지 결정할 재료이며, 아직 softmax 확률이나 Value 가중합은 아니다.
- question: 미래 위치의 점수를 0으로 바꾸는 것이 올바른 causal mask인가?
  answer: 아니다. exp(0)은 1이므로 차단되지 않는다. softmax 이전에 미래 점수에 음의 무한대를 더하거나 매우 작은 값으로 설정한다. 대각선과 이전 위치는 허용한다.
- question: 어텐션 가중치의 softmax 축과 언어 모델 출력 softmax 축은 어떻게 다른가?
  answer: 어텐션은 한 Query 위치가 참고할 입력 위치들 사이에서 행별 정규화한다. 언어 모델 출력은 다음 토큰 후보인 전체 어휘 사이에서 정규화한다. 화면에 표시한 일부 어휘 후보의 합만으로 1을 요구하면 안 된다.
- question: FFN은 서로 다른 토큰 위치의 정보를 직접 섞는가?
  answer: 기본 위치별 FFN은 각 위치에 같은 함수를 독립 적용해 특징을 변환한다. 서로 다른 토큰 위치의 정보 혼합은 어텐션이 담당한다. FFN의 폭은 확장 후 다시 원래 폭으로 축소하여 잔차 합이 가능하게 한다.
- question: BERT, Qwen, T5를 각각 어떤 구조 계열로 분류하는가?
  answer: BERT는 encoder-only, Qwen은 decoder-only, T5는 encoder–decoder다. T5가 문장을 생성한다는 이유로 decoder-only로 분류하면 안 된다. 기본·지시 튜닝 구분은 구조 계열과 별개의 축이다.
- question: 정답 다음 토큰에 확률 0.2를 준 경우와 0.8을 준 경우 중 손실이 더 큰 것은 어느 쪽인가?
  answer: 자연로그 음의 로그손실은 확률 0.2에서 약 1.609, 0.8에서 약 0.223이므로 0.2 쪽이 더 크다. 정답에 높은 확률을 줄수록 손실은 작아진다.
- question: few-shot 예시를 입력에 추가하면 모델 가중치가 자동으로 업데이트되는가?
  answer: 아니다. 추론에서 프롬프트와 문맥 표현은 달라지지만 gradient와 optimizer step이 없으면 가중치는 갱신되지 않는다. 데이터로 가중치를 추가 학습하는 미세조정과 구분한다.
- question: 생성 루프에서 매번 전체 출력 문자열을 다시 토큰화하지 않고 ID를 이어 붙이는 이유는 무엇인가?
  answer: 이미 선택한 토큰 시퀀스를 그대로 유지하기 위해서다. 개별 조각 decode와 문자열 결합 후 재토큰화는 같은 ID열을 보장하지 않는다. ID를 이어 붙이고 마지막에 전체를 decode한다.
- question: KV 캐시를 사용하면 다음 토큰들을 모두 동시에 결정할 수 있는가?
  answer: 아니다. 이미 계산한 이전 위치의 K/V를 재사용하여 중복 계산을 줄일 뿐, 새 토큰 선택에 따른 다음 문맥의 의존성은 남는다. 캐시는 임시 추론 상태이며 학습된 모델 가중치가 아니다.
