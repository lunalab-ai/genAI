source: course/notion/w06a/w06a-workbook.md
provenance: W06A 기록지의 12개 질문 중 핵심10개(Q4·Q8 제외)를 그대로 선별한 복습 해설. 실습 완성 코드와 교수자 대본은 비공개로
  분리.
items:
- question: Q1. 전방 손상, 학습, 생성에서 각각 무엇이 바뀌는가?
  answer: 전방은 원본과 정답 잡음에서 이미지 상태를 계산한다. 학습은 손실과 gradient를 이용하여 모델 모수와 optimizer 상태를
    바꾼다. 생성은 학습된 모수를 고정하고 새로운 잡음에서 이미지 상태를 반복 갱신한다.
- question: Q2. beta와 alpha_bar는 어떻게 다르며, 코드 t=0은 깨끗한 원본인가?
  answer: beta는 한 단계에 추가하는 잡음 분산이고, alpha_bar는 (1-beta)의 누적곱이다. 실제 픽셀에 곱하는 계수는 제곱근이다.
    코드 t=0은 첫 노이즈 단계이고 수학의 깨끗한 x0와 다르다.
- question: Q3. alpha_bar=0.64, x0=0.5, epsilon=-1일 때 noisy 픽셀은 얼마인가?
  answer: $\sqrt{0.64}\times0.5+\sqrt{0.36}\times(-1)=0.4-0.6=-0.2$다. 분산값을 그대로 픽셀에
    곱하지 않는다.
- question: Q5. beta가 선형이면 신호 계수도 선형인가? 마지막에 표준정규 잡음만 남는지도 자동 보장되는가?
  answer: 아니다. beta가 선형이어도 alpha_bar는 누적곱이고 신호 계수는 그 제곱근이다. 100단계 linear beta_end0.02에서는
    잔여 신호가 상당히 남는다. 마지막 alpha_bar와 생성 시작 분포를 확인해야 한다.
- question: Q6. 원본에만 척도0.5를 곱하고 잡음은 유지하면 신호 분산과 SNR은 어떻게 변하는가?
  answer: 원본 신호의 분산에 $0.5^2=0.25$가 곱해진다. 잡음 분산이 같으므로 그 정의의 SNR도0.25배다. 화면을 칸마다 자동
    대비 조정하면 이 차이가 가려질 수 있다.
- question: Q7. U-Net에서 시간 조건과 skip 연결은 각각 어떤 정보를 제공하는가?
  answer: 시간 조건은 지금 입력의 노이즈 수준에 관한 정보를 준다. skip 연결은 같은 공간 해상도의 앞쪽 세부 특징을 뒤쪽에 전달한다.
    시간 임베딩과 스케줄 계수, residual 연결과 긴 U자형 skip을 각각 구분한다.
- question: Q9. a=0.8, b=0.6, x0=0.5, epsilon=-1일 때 표준 v는 얼마이며 원본을 어떻게 복원하는가?
  answer: $v=0.8(-1)-0.6(0.5)=-1.1$이다. $x_t=-0.2$이므로 $x_0=0.8(-0.2)-0.6(-1.1)=0.5$다.
    이번 표준 정의는 Diffusers get_velocity의 빼기 부호와 일치한다.
- question: Q10. epsilon 모델의 추론 설정만 v_prediction으로 바꾸거나 목표별 raw MSE를 직접 비교하면 왜 문제가
    되는가?
  answer: 출력 shape이 같아도 의미가 다르다. epsilon 가중치를 v 출력으로 해석하면 역방향 계산이 잘못된다. 목표별 오차가 원본
    오차에 전달되는 시점별 배율도 달라 raw MSE 수치만으로 모델 우열을 정할 수 없다.
- question: Q11. 숫자5 데이터 선택, 32회 학습, 체크포인트 로드, DDIM20 생성은 각각 어떤 작업인가?
  answer: 숫자5 선택은 모집단을 정하는 데이터 필터다. 32회 학습은 새 모델의 배치별 optimizer 갱신이며32epoch가 아니다.
    체크포인트 로드는 이미 학습한 모수를 읽는 작업이다. DDIM20은 그 모수를 고정한 채20번 호출해 생성하는 추론이다.
- question: Q12. 잡음 MSE 감소와 생성 품질 향상을 구별하여 평가하려면 어떤 기록이 필요한가?
  answer: 평가 데이터·분할·시점·잡음·seed·모델·샘플러·표본 수·시간을 기록한다. 같은 조건의 미사용 데이터 MSE와 전체 생성 격자를
    함께 보고, 인식 가능성·다양성·실패를 구분한다. 표본8장의 관찰이나 픽셀 표준편차만으로 분포 전체의 품질을 단정하지 않는다.
