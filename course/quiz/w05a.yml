source: course/notion/w05a/w05a-image-representations.md
provenance: W05A 자체 점검 질문의 별도 복습 해설. 실습 조립 문제의 교수자 풀이와 구별한다.
items:
- question: Q1. AE의 학습 target은 무엇이며, 숫자 라벨은 이번 실습에서 어디에 쓰이는가?
  answer: 원본 입력 이미지의 픽셀이 target이다. 숫자 라벨은 학습에 넣지 않고 잠재 산점도 색과 관찰에만 쓴다.
- question: Q2. 네 픽셀의 제곱 오차 합이 0.1일 때 MSE는 얼마인가?
  answer: 0.1÷4=0.025다. 합과 평균은 분모가 다르다. 실제 배치 MSE는 전체 원소 평균이다.
- question: Q3. backward와 optimizer.step은 각각 무엇을 하는가?
  answer: backward는 모수의 gradient를 계산하고, optimizer.step은 그 gradient로 모수를 갱신한다. backward만으로
    모수 값이 갱신되지는 않는다.
- question: Q4. AE의 좋은 복원이 표준정규 잠재 샘플의 좋은 생성을 보장하는가?
  answer: 보장하지 않는다. AE는 실제 입력을 인코딩한 좌표의 복원만 학습한다. 임의 표준정규 좌표와 인코딩된 좌표의 분포를 일치시키는 제약이
    없다.
- question: Q5. logvar가 log 4이면 분산과 표준편차는 각각 얼마인가?
  answer: 분산은 exp(log 4)=4, 표준편차는 exp(0.5 log 4)=2다.
- question: Q6. 평균 (1,-1), 표준편차 (2,0.5), 잡음 (0.5,-2)의 재매개변수화 결과는 무엇인가?
  answer: (1,-1)+(2,0.5)⊙(0.5,-2)=(2,-2)다. 잡음에는 분산이 아니라 표준편차를 곱한다.
- question: Q7. VAE 복원항을 픽셀 합에서 픽셀 평균으로 바꾸고 β를 유지하면 무엇이 달라지는가?
  answer: 784픽셀 합을 평균으로 바꾸면 복원항이 1/784로 줄어 KL의 상대 영향이 784배가 된다. 같은 상대 가중치를 원하면 β도
    1/784로 조정한다.
- question: Q8. CLIP의 두 인코더 내부 차원이 달라도 비교할 수 있는 이유는 무엇인가?
  answer: 각 인코더 출력에 투영을 적용해 동일한 공통 임베딩 차원으로 맞춘다. 이번 B/32의 공통 차원은 512다.
- question: Q9. CLIP 검색의 코사인 점수나 후보 softmax를 정답 확률로 읽으면 안 되는 이유는 무엇인가?
  answer: 코사인은 방향 유사도이며 보정된 정답 확률이 아니다. softmax는 온도·후보 집합에 의존하는 상대 점수이고, 관련 대상이 없어도
    합이 1이다.
- question: Q10. 관련 사진이 두 장인 상위 3개 결과의 Precision@3은 얼마이며, 관련 대상이 없을 때 top-k는 어떻게 동작하는가?
  answer: 2/3이다. top-k는 현재 후보 중 높은 순서로 k개를 반환하므로 관련 대상이 없어도 결과가 나온다. 그 경우 P@3은 0이며
    별도의 거절 판단이 필요하다.
