source: course/notion/w10b/w10b-workbook.md
provenance: 기록지 Q1–Q10의 별도 공개 개념 해설. 전체 실습 풀이와 장말 상세 해설은 비공개.
items:
- question: DreamBooth와 LoRA를 서로 배타적인 방법으로 분류하면 왜 틀리는가?
  answer: DreamBooth는 특정 대상과 prior 보존을 다루는 데이터/목적 설계이고 LoRA는 갱신을 저랭크 행렬로 제한하는 방식이다.
    둘을 함께 사용할 수 있다.
- question: 확산 모델의 학습에서 이미지와 노이즈 중 무엇이 정답인지 어떻게 확인하는가?
  answer: 설정의 prediction_type을 확인한다. 수업 모델과 SD1.5의 epsilon 경로에서는 주입한 noise가 정답이다.
    다른 scheduler의 v_prediction이면 velocity target을 사용한다.
- question: instance loss와 prior loss의 분모를 분리해야 하는 이유는 무엇인가?
  answer: 각 집합 평균을 낸 뒤 lambda를 곱해야 표본 수와 목적의 가중치를 구별할 수 있다. 단순 전체 평균은 의도한 가중합과 달라진다.
- question: identifier 문자열을 쓰면 tokenizer에 새 토큰이 자동으로 추가되는가?
  answer: 아니다. 기존 tokenizer가 subword로 나눌 수 있다. 새 vocabulary와 embedding 학습은 별도 구현이다.
- question: prior 보존 손실이 기존 지식의 완전한 보존을 보장하는가?
  answer: 아니다. 유한한 class 샘플과 가중치로 망각을 줄이려는 목적이다. 미사용 클래스와 prompt에서 별도 평가한다.
- question: rank와 alpha와 추론 강도는 각각 무엇을 바꾸는가?
  answer: rank는 어댑터 shape와 용량, alpha/r은 학습 업데이트 scale, 추론 강도는 저장된 업데이트의 현재 기여도를 바꾼다.
- question: LoRA가 실제 학습되었다는 증거로 파일 생성만으로 충분한가?
  answer: 아니다. base불변·유한 gradient·adapter변화·실제 update와 같은 base에서의 복원 probe를 확인해야 한다.
- question: 4+1+4=9채널은 무엇이며 LoRA만으로 새 입력 채널이 생기는가?
  answer: noisy latent4, mask1, masked RGB의 VAE latent4이다. 입력층 구조와 해당 조건을 사용하는 학습이
    필요하다.
- question: SDXL의 두 text encoder와 추가 조건을 SD1.5와 어떻게 구별하는가?
  answer: SDXL base는 두 token feature를 이어2048차원으로 만들고 pooled text1280과 원본크기/crop/목표크기6값을
    추가한다. SD1.5 기록을 SDXL 실행으로 표시하지 않는다.
- question: 대상은 닮지만 배경 지시를 따르지 못할 때 어떤 평가와 다음 실험이 필요한가?
  answer: 대상 보존과 배경 이행을 분리해 고정된 미사용 prompt·seed로 평가한다. 다른 설정을 고정하고 학습 배경 다양성 등 원인
    하나를 바꿔 검증한다.
