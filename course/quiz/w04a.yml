source: course/notion/w04a/w04a-autoencoders.md
provenance: 주교재3.1에 대응하는 W04A 자체 작성 점검 질문의 해설. 실습 빈칸 풀이와는 별도인 복습용 자료.
items:
- question: Q1. 오토인코더의 학습 target은 숫자 라벨인가, 입력 이미지인가?
  answer: "입력 이미지다. 원본 픽셀과 복원 픽셀의 차이를 줄인다. 입력에서 target을 얻는 자기 지도 학습이며, 이번 실습의 숫자 라벨은 잠재 산점도의 색에만 쓴다."
- question: Q2. `(B,16,7,7)`을 배치를 유지하며 펼치면 어떤 shape인가?
  answer: "`(B,784)`다. `Flatten(start_dim=1)`로 배치 뒤의 특징 축만 합친다.0번 축까지 합치면 이미지별 표본 구분을 잃는다."
- question: Q3. 네 픽셀의 제곱 오차 합이0.1이면 평균 MSE는 얼마인가?
  answer: "0.025다. 합0.1을 픽셀4개로 나눈다. PyTorch 기본 MSELoss는 배치와 채널과 모든 공간 픽셀을 포함한 전체 원소 평균이다."
- question: Q4. 전치 합성곱이 인코더의 진짜 역함수라고 할 수 있는가?
  answer: "아니다. 출력 크기를 늘리는 학습 가능한 연산이지만 축소에서 잃은 정보를 완벽히 되돌린다는 보장은 없다. 인코더와 디코더의 모수도 별도로 학습된다."
- question: Q5. `eval()`과 `inference_mode()`는 같은 역할인가?
  answer: "다르다. eval은 Dropout·BatchNorm 등의 평가 모드를 선택하며, inference_mode는 미분 기록을 생략한다. eval만으로 autograd가 꺼지는 것은 아니다."
- question: Q6. 학습 전보다 MSE가 작아졌다는 사실만으로 평균 이미지 기준선보다 낫다고 할 수 있는가?
  answer: "아니다. 동일한 test와 같은 손실 정의로 기준선을 별도로 측정해야 한다. 실제 W04A의2차원 모델은 초기보다 개선됐지만5epoch 뒤 평균 기준선보다 약간 나빴다."
- question: Q7. 잠재 산점도에 숫자 라벨 색을 표시하면 라벨을 이용해 학습했다는 뜻인가?
  answer: "아니다. 학습에 쓴 입력·target과 사후 시각화의 색 정보는 구별한다. 이번 모델은 라벨을 받지 않고 이미지를 복원하도록 학습했다."
- question: Q8. 좋은 복원 성능이 임의 잠재 좌표의 생성 품질까지 보장하는가?
  answer: "아니다. 훈련은 실제 입력의 인코딩에서 복원을 요구했다. 임의로 뽑은 좌표의 분포와 실제 인코딩의 분포를 일치시키는 제약이 없으므로 빈 영역의 디코딩 품질은 보장되지 않는다."
