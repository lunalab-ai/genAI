source: course/notion/w03b/w03b-transformer-walkthrough.md
provenance: W03B 출구 질문 Q1–Q3 및 핵심 보강 개념에 대한 자체 작성 해설.
items:
- question: 'Q1. 잔차 덧셈에서 두 배열은 어떤 조건을 만족해야 하는가?'
  answer: 같은 토큰 위치와 같은 특징을 대응시켜 더하므로 모양이 같아야 한다. 예시에서는 둘 다 3×4다. concat과 달리 특징 폭을 늘리지 않는다.
- question: 'Q2. causal mask는 자기 자신도 가리는가? 미래 점수를 0으로 만들면 되는가?'
  answer: 자기 자신과 이전 위치는 허용하고 미래 위치만 가린다. softmax 전 미래에 음의 무한대를 더한다. 0은 exp(0)=1이므로 차단이 아니다.
- question: 'Q3. 한 토큰을 고른 다음 forward에는 무엇을 넣는가?'
  answer: 기존 ID열에 새 ID를 이어 붙인 확장 입력을 넣는다. 원래 입력만 계속 넣으면 같은 조건의 첫 토큰을 다시 예측한다. EOS나 한도에 도달하면 멈춘다.
- question: FFN과 어텐션은 어떻게 역할이 다른가?
  answer: 어텐션은 위치들 사이의 정보를 섞는다. 위치별 FFN은 같은 가중치를 각 행에 독립 적용하여 특징을 비선형 변환한다. FFN 자체는 다른 행을 직접 참고하지 않는다.
- question: 두 개의 3×2 head를 concat하면 6×2인가?
  answer: 아니다. 특징 열 방향으로 결합하므로 3×4다. 출력 투영 후 입력 폭과 같아져 잔차 합이 가능하다.
- question: T5가 문장을 생성하므로 decoder-only라고 할 수 있는가?
  answer: 아니다. T5는 encoder–decoder이며 디코더의 cross-attention이 인코더 표현을 참고한다. 생성 여부와 구조 분류는 같은 기준이 아니다.
- question: 어텐션 표의 확률과 다음 토큰 확률의 정규화 축은 같은가?
  answer: 다르다. 어텐션은 한 Query가 참고할 입력 위치들 사이에서 정규화하고, 출력층은 다음 토큰 후보인 전체 어휘 사이에서 정규화한다.
- question: 추론 중 프롬프트 변경은 미세조정인가?
  answer: 아니다. 입력과 문맥 표현은 바뀌지만 optimizer로 가중치를 갱신하지 않았다. 미세조정은 추가 데이터와 손실을 사용해 가중치를 학습하는 별도 과정이다.
