source: course/notion/w02a/w02a-colab-generative-demo.md
provenance: 이번 차시 본문의 점검 퀴즈. 학생 공개용 해설이며 실습 과제 전체 풀이와 구분합니다.
items:
- question: 원본 노트북을 열고 바로 수정하기보다 Drive에 사본을 저장하는 이유는 무엇인가요?
  answer: 원본을 보존하고 자신의 변경·실험 기록을 Drive에 저장하기 위해서입니다. 공유 원본의 편집 권한과 개인 사본의 저장 위치는 다릅니다.
- question: 노트북 파일이 저장되어 있어도 런타임 재시작 후 NameError가 날 수 있는 이유는 무엇인가요?
  answer: 파일은 코드와 설명을 보관하지만 런타임 메모리의 변수는 재시작하면 사라집니다. 정의 셀부터 순서대로 실행합니다.
- question: 같은 seed로 난수 생성기를 매번 새로 만든 실험을 비교하는 목적은 무엇인가요?
  answer: 난수 조건을 통제하여 설정 변화의 영향을 비교하고 같은 환경에서 결과를 재현하기 위해서입니다.
- question: 확률이 0.5인 후보가 12번 추출에서 반드시 6번 나오나요?
  answer: 아닙니다. 0.5는 각 추출의 확률입니다. 12회 중 실제 횟수는 달라질 수 있습니다.
- question: temperature를 바꿀 때 seed와 다른 조건을 고정하는 이유는 무엇인가요?
  answer: 결과 차이가 다른 무작위 조건 때문인지 혼동하지 않고 temperature의 영향을 비교하기 위해서입니다.
- question: 오늘의 문자 bigram 모델과 절차적 이미지 생성기는 무엇이 다른가요?
  answer: bigram은 말뭉치의 인접 문자 빈도로 전이 확률을 학습합니다. 이미지 예시는 사람이 정한 난수·색상 규칙을 실행하며 이미지 데이터에서
    학습하지 않습니다.
- question: 16,000 Hz로 2초 오디오를 표현하면 샘플은 몇 개인가요?
  answer: 16000 × 2 = 32000개입니다. 샘플 수이며 파일 크기와 동일하지 않습니다.
- question: 생성 문장이 자연스럽다는 사실만으로 사실성이 보장되지 않는 이유는 무엇인가요?
  answer: 그럴듯한 문자열 생성과 사실 검증은 다릅니다. 근거 자료와 대조해야 합니다.
