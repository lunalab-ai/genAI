<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><rect width="1200" height="360" fill="#f6f8fc"/><g font-family="Malgun Gothic,Arial,sans-serif" fill="#172554"><text x="35" y="45" font-size="26" font-weight="bold">사전학습 모델과 호출의 역할</text><rect x="35" y="76" width="350" height="215" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="55" y="111" font-size="22" font-weight="bold">한 번 준비</text><text x="55" y="153" font-size="19">LanguageModelLab()</text><text x="55" y="184" font-size="19">고정된 모델 파일 읽기</text><text x="55" y="215" font-size="19">tokenizer / model 저장</text><text x="55" y="246" font-size="19">이 수업에서 가중치 학습 없음</text><text x="394" y="190" font-size="30">→</text><rect x="425" y="76" width="350" height="215" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="445" y="111" font-size="22" font-weight="bold">같은 객체에 입력</text><text x="445" y="153" font-size="19">lab.next_tokens(text)</text><text x="445" y="184" font-size="19">문장 → 토큰 ID → 모델</text><text x="445" y="215" font-size="19">마지막 위치의 전체 로짓</text><text x="445" y="246" font-size="19">softmax는 전체 어휘에 적용</text><text x="784" y="190" font-size="30">→</text><rect x="815" y="76" width="350" height="215" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="835" y="111" font-size="22" font-weight="bold">화면에서 결과 읽기</text><text x="835" y="153" font-size="19">상위 8개 후보 표</text><text x="835" y="184" font-size="19">보이는 확률 합은 1 이하</text><text x="835" y="215" font-size="19">새 입력이면 추론을 다시 실행</text><text x="835" y="246" font-size="19">앱 callback도 같은 lab 사용</text><text x="35" y="333" font-size="18">직접 설계한 코드 흐름도 · 객체 생성, 모델 추론, 결과 표시를 구분한다.</text></g></svg>