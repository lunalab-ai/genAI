   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'Malgun Gothic', 'DejaVu Sans'; text-anchor: start; fill: #183449" x="23.94" y="42.042937" transform="rotate(-0 23.94 42.042937)">정답을 사람이 붙이지 않아도 학습 신호는 있다</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Malgun Gothic', 'DejaVu Sans'; text-anchor: start; fill: #516678" x="23.94" y="66.543969" transform="rotate(-0 23.94 66.543969)">학습용 토큰 예시다. 토큰화·특수 토큰 정책은 실제 모델 설정에 따른다.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'Malgun Gothic', 'DejaVu Sans'; fill: #007f86" transform="translate(142.439141 156.839703)">causal LM</text>
