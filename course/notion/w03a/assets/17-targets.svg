   </g>
   <g id="text_5">
    <text style="font-size: 13px; font-family: 'Malgun Gothic', 'DejaVu Sans'; fill: #183449" transform="translate(29.52 269.194781)">causal loss: 정답 다음 토큰에 준 확률이 낮을수록 손실이 커진다.</text>
    <text style="font-size: 13px; font-family: 'Malgun Gothic', 'DejaVu Sans'; fill: #183449" transform="translate(29.52 289.944)">MLM: 마스킹·선택된 위치의 원래 토큰을 맞힌다. BERT의 전체 가리기 정책은 별도다.</text>
