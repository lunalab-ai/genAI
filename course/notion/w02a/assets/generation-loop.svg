<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280"><rect width="900" height="280" fill="white"/><g font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" fill="#18304b"><text x="30" y="45" font-size="25" font-weight="bold">문자 bigram 생성</text><rect x="25" y="90" width="265" height="115" rx="12" fill="#e9f2ff" stroke="#2860a0"/><text x="157" y="132" text-anchor="middle" font-size="21" font-weight="bold">현재 문자</text><text x="157" y="173" text-anchor="middle" font-size="16">예: d</text><text x="302" y="153" font-size="22">→</text><rect x="315" y="90" width="265" height="115" rx="12" fill="#e9f2ff" stroke="#2860a0"/><text x="447" y="132" text-anchor="middle" font-size="21" font-weight="bold">다음 문자 확률</text><text x="447" y="173" text-anchor="middle" font-size="16">말뭉치의 인접 빈도</text><text x="592" y="153" font-size="22">→</text><rect x="605" y="90" width="265" height="115" rx="12" fill="#e9f2ff" stroke="#2860a0"/><text x="737" y="132" text-anchor="middle" font-size="21" font-weight="bold">샘플링 · 이어붙이기</text><text x="737" y="173" text-anchor="middle" font-size="16">새 문자를 현재로 반복</text><text x="30" y="251" font-size="17">temperature는 확률 분포를 조정하고 seed는 난수 조건을 정합니다.</text></g></svg>