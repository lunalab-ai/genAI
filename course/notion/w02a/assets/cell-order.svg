<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280"><rect width="900" height="280" fill="white"/><g font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" fill="#18304b"><text x="30" y="45" font-size="25" font-weight="bold">셀 실행 순서</text><rect x="25" y="90" width="265" height="115" rx="12" fill="#e9f2ff" stroke="#2860a0"/><text x="157" y="132" text-anchor="middle" font-size="21" font-weight="bold">정의 셀</text><text x="157" y="173" text-anchor="middle" font-size="16">import · 변수 · 함수</text><text x="302" y="153" font-size="22">→</text><rect x="315" y="90" width="265" height="115" rx="12" fill="#e9f2ff" stroke="#2860a0"/><text x="447" y="132" text-anchor="middle" font-size="21" font-weight="bold">실험 셀</text><text x="447" y="173" text-anchor="middle" font-size="16">입력과 설정으로 실행</text><text x="592" y="153" font-size="22">→</text><rect x="605" y="90" width="265" height="115" rx="12" fill="#e9f2ff" stroke="#2860a0"/><text x="737" y="132" text-anchor="middle" font-size="21" font-weight="bold">관찰 셀</text><text x="737" y="173" text-anchor="middle" font-size="16">출력 비교 · 기록</text><text x="30" y="251" font-size="17">런타임을 재시작하면 위에서부터 다시 실행합니다.</text></g></svg>