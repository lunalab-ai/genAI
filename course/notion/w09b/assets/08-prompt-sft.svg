   <g id="text_1">
    <text style="font-weight: 700; font-size: 17px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #19324a" x="19.476" y="28.927627" transform="rotate(-0 19.476 28.927627)">입력을 바꾸는가, 가중치를 학습시키는가?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Malgun Gothic'; fill: #19324a" transform="translate(101.822 70.111932)">프롬프팅</text>
    <text style="font-size: 11px; font-family: 'Malgun Gothic'; fill: #19324a" transform="translate(63.751688 81.875487)">지시·예시를 입력에 추가</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'Malgun Gothic'; fill: #19324a" transform="translate(334.980578 70.25201)">추론 시 입력 변화 → 응답 변화</text>
