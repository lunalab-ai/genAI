    <text style="font-weight: 700; font-size: 23px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #17324d" x="26.91" y="33.4728" transform="rotate(-0 26.91 33.4728)">지표가 다른 질문에 답한다는 증거</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #465a6e" x="26.91" y="60.6384" transform="rotate(-0 26.91 60.6384)">낮은 PPL이나 높은 단어 겹침이 곧 사실성·근거성·지시 이행은 아닙니다.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 15px; font-family: 'Malgun Gothic'; fill: #17324d" transform="translate(115.873828 128.034422)">PPL: exp(토큰 평균 NLL)</text>
    <text style="font-size: 15px; font-family: 'Malgun Gothic'; fill: #17324d" transform="translate(84.541406 153.147703)">문서·토크나이저·길이·마스크 고정</text>
    <text style="font-size: 15px; font-family: 'Malgun Gothic'; fill: #17324d" transform="translate(36.142969 177.147703)">토큰 수가 다른 배치 평균을 다시 평균내지 않기</text>
   </g>
   <g id="text_4">
    <text style="font-size: 15px; font-family: 'Malgun Gothic'; fill: #17324d" transform="translate(438.855469 129.407859)">참조: The room closes at 18:00.</text>
    <text style="font-size: 15px; font-family: 'Malgun Gothic'; fill: #17324d" transform="translate(438.855469 153.1395)">후보: The room closes at 20:00.</text>
    <text style="font-size: 15px; font-family: 'Malgun Gothic'; fill: #17324d" transform="translate(413.6625 177.147703)">대부분 단어가 같지만 시각은 틀립니다.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15px; font-family: 'Malgun Gothic'; fill: #17324d" transform="translate(133.594219 253.472297)">사람 평가: 근거의 사실과 일치? · 질문에 답했나? · 요청 형식을 지켰나?</text>
    <text style="font-size: 15px; font-family: 'Malgun Gothic'; fill: #17324d" transform="translate(161.880937 276.398859)">검색 평가는 정답 근거가 top-k에 있었는지 별도로 확인합니다.</text>
   </g>
